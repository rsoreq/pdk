name: "release"

on:
  workflow_dispatch:
   inputs:
    target:
      description: "The target for the release. This can be a commit sha or a branch."
      required: false
      default: "main"

jobs:
  release:
    uses: "puppetlabs/cat-github-actions/.github/workflows/gem_release.yml@e512c428365648bc64fa4d8f36eff0d185ebf8a2" # main
    with:
      target: "${{ github.event.inputs.target }}"
    secrets: "inherit"
